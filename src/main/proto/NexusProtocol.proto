syntax = "proto3";

import "google/protobuf/timestamp.proto";

package org.nexus.base.proto;

option optimize_for = SPEED;

message Ping {
  uint32 ping = 1; // used to keep track of the number of pings between peers
}

message Header{// request get header
    repeated bytes hash = 1;  // max of 500 items
}

message BlockHeader {
  bytes merkle_root = 4;
  bytes block_hash = 1;           // block header hash
  bytes prev_hash = 2;            // previous block hash
   
}

message Block {// get block by hash

  BlockHeader header = 1;
  int64 timestamp = 3;             // Unix epoch timestamp (seconds)
  bytes proposer = 4;             // base58 public key of proposer
  repeated Transaction transactions = 6; // list of interactions (transactions)
  bytes block_signature = 7;      // proposer or aggregated signature
  uint64 version = 5;
  fixed64 nonce = 2;
  optional uint32 difficulty_target = 9; // compact representation (nBits)
  Policy policy = 8;    
}

message RejectMessage {
  // "tx", "block", or other message type that was rejected
  string rejected_message = 1;

  // The reason code
  RejectCode code = 2;

  // Human-readable rejection reason
  string reason = 3;

  // Hash of rejected object (only for tx or block)
  bytes rejected_message_hash = 4;
}

// Enum matching Bitcoin's reject reason codes
enum RejectCode {
  REJECT_MALFORMED = 0;       // 0x01
  REJECT_INVALID = 16;        // 0x10
  REJECT_OBSOLETE = 17;       // 0x11
  REJECT_DUPLICATE = 18;      // 0x12
  REJECT_NONSTANDARD = 64;    // 0x40
  REJECT_DUST = 65;           // 0x41
  REJECT_INSUFFICIENTFEE = 66;// 0x42
  REJECT_CHECKPOINT = 67;     // 0x43
  REJECT_OTHER = 255;         // 0xFF
}

// Represents policy configuration for a block
message Policy {
  uint64 total_supply_cap = 1;             // maximum supply
  bytes locked_until = 2;                 // ISO timestamp string
}

message TransactionOutPoint {
  bytes hash = 1;      // transaction hash being referenced
  uint64 index = 2;    // output index in that transaction
}


message Witness {
  // A witness is a stack of byte arrays. Each element is a pushed item on the witness stack.
  repeated bytes stack = 1;
}

message TransactionInput {
  TransactionOutPoint outpoint = 1;
  bytes script_bytes = 2;  // API call parameters or service input data
  uint64 sequence = 3;
  optional uint64 value = 4;  // optional value for tracking
  Witness witness = 5;        // per-input witness stack (optional; usually present only for segwit spends)

}

message TransactionOutput {
  uint64 value = 1;
  bytes script_bytes = 2;  // API response data or service output
}

message Transaction {
  uint64 version = 1;
  repeated TransactionInput inputs = 2;
  repeated TransactionOutput outputs = 3;
  uint64 lock_time = 4;
  optional bytes signature = 5;
}

message GetBlockchain {// request download of blockchain

}

message BroadcastManifestBlock{// send block to all peers

}

message Manifest {
  bytes cid = 1; // signed manifest id
  string category = 2; // manifest category
  bytes public_key = 3;
}

message GetManifestContent { // request a manifest content based on CID
    bytes cid = 1; // signed manifest id used to ask the network 
}

message ManifestContent { // actual content
    bytes cid = 1;  // signed owner manifest cid
    bytes raw = 2; // raw manifest content
}

message GetPeers {
  uint32 size = 2; // get required number of actives peers from a peer, protects system from flooding from bad actors
  bytes cid = 1; // signed manifest id
  string category = 3; // manifest category      
}

message GetPeersResponse {
      repeated string addresses = 3;
}

// still trying to understand this fully
message Call {
  string api_id = 1;// spec path
  bytes request = 3; // fixed numbering (no gaps)
  Result response = 4;
}

message Result {
  uint32 status = 1;  // 0=OK, 1=Error
  string message = 2;
  bytes response_data = 3;
}

message NexusMessage {
  oneof payload {
    Manifest manifest   = 1;
    Ping ping   = 2;
    GetPeersResponse peers = 3;
    Call functionCall = 4;
    GetManifestContent getManifestContent = 5;
    ManifestContent manifestContent = 6;
    GetPeers peersDiscovery = 7;
    Challenge handshake = 8; // handshake protocol
    ChallengeResponse handshakeResponse = 9; // handshake challenge response
    Block block = 10;
    Transaction transaction = 11;
     RejectMessage rejectedMessage = 12;
     Header header = 13;
     Header getHeader = 14;
  }
}

// initiate handshake with a nonce challenge
message Challenge {
    fixed64 nonce = 1;
    fixed64 genesisHash = 2;
}

// handshake challenge response
message ChallengeResponse {
    bytes public_key = 1;
    fixed64 nonce = 2;
}

// size matters
// UUID (128 bits / 16 bytes)
// long (64 bits / 8 bytes) 
// That’s 8 bytes saved per ID. Since you have 2 IDs (node + message), you save 16 bytes per message.
// Example:
// If your average message is ~125 bytes 
// With UUIDs → 125 bytes
// With longs → ~109 bytes
// That’s about 13% smaller messages. Over millions of messages, that’s a real bandwidth and memory difference.
// TODO: optimize payload sizes
message NexusEnvelop {
   uint32 version = 1;
    bytes node_id = 2; // node id, would have to do some research how this would matter from a peer to peer network point of view
    bytes message_id = 3;     // UUID as string but should be reduced to a 8 bytes
    NexusMessage message = 4;        // optional message-specific payload
    bytes checksum = 5;       // first 4 bytes of double SHA-256(payload)    should be smaller as well
    google.protobuf.Timestamp time_stamp = 6;// request and response time stamp
    bytes signature = 11;          // signature over manifest (except signature field)
}